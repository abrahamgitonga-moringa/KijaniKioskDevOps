service: kijani-receipts

frameworkVersion: '>=3.0.0'

provider:
  name: aws
  runtime: nodejs18.x
  stage: ${opt:stage, 'dev'}
  region: af-south-1
  environment:
    NODE_ENV: ${self:provider.stage}
    DEFAULT_CURRENCY: KES
    SERVICE_NAME: ${self:service}

plugins:
  - serverless-offline
  - serverless-s3-local

custom:
  receiptsBucket: kk-payments-receipts-${self:provider.stage}
  processorBucket: kk-receipts-processed-${self:provider.stage}
  notifierBucket: kk-notifications-queue-${self:provider.stage}
  s3:
    host: localhost
    port: 4569
    directory: /tmp/kijani-s3-local
  serverless-offline:
    httpPort: 3000
    lambdaPort: 3002

functions:
  generateReceipt:
    handler: handlers/receipts.generate
    environment:
      OUTPUT_BUCKET: ${self:custom.processorBucket}
    events:
      - httpApi:
          path: /receipts
          method: POST

  processReceiptUpload:
    handler: handlers/processor.process
    timeout: 30
    memorySize: 256
    environment:
      NOTIFIER_BUCKET: ${self:custom.notifierBucket}
    events:
      - s3:
          bucket: ${self:custom.receiptsBucket}
          event: s3:ObjectCreated:*
          rules:
            - prefix: receipt-
            - suffix: .json
          existing: false

  notifyReceipt:
    handler: handlers/notifier.notify
    environment:
      NOTIFICATION_CHANNEL: log
    events:
      - s3:
          bucket: ${self:custom.processorBucket}
          event: s3:ObjectCreated:*
          rules:
            - prefix: processed-
            - suffix: .json
          existing: false

resources:
  Resources:
    ReceiptsBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.receiptsBucket}
    ProcessorBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.processorBucket}
    NotifierBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.notifierBucket}
