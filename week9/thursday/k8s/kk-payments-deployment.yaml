apiVersion: apps/v1
kind: Deployment
metadata:
  name: kk-payments
  labels:
    app: kk-payments
  annotations:
    kubernetes.io/change-cause: "Add readiness/liveness probes and resource limits"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: kk-payments
  template:
    metadata:
      labels:
        app: kk-payments
    spec:
      containers:
      - name: kk-payments
        image: kijani-registry.internal:5000/kk-payments:2.0.3-a555a15  # Keep your current image tag
        ports:
        - containerPort: 3001
        envFrom:
        - configMapRef:
            name: kk-payments-config
        - secretRef:
            name: kk-payments-secrets
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
          successThreshold: 1
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 15
          periodSeconds: 20
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
